# ============================================================
# Nginx 配置 —— 管理后台前端
#   /        → Vue 单页应用（dist/），history 模式刷新不 404
#   /api/    → 反代到后端容器 snake-backend:8080/api/
# ============================================================

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ===== 前端静态资源（Vue SPA）=====
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 解决 Vue Router history 模式刷新 404
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（Vite 产物带 hash，可长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== 反代后端 API =====
    # 前端请求 /api/xxx → Nginx 代理到 http://snake-backend:8080/api/xxx
    location /api/ {
        proxy_pass http://snake-backend:8080;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 透传真实请求头（JWT 鉴权需要）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
