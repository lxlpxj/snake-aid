services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: snake-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456  # 数据库 root 密码
      MYSQL_DATABASE: snake_aid        # 自动创建的数据库名
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql    # 数据持久化
      - ./docs/sql:/docker-entrypoint-initdb.d # 自动执行 init.sql
    networks:
      - snake-network

  # 2. Redis 缓存
  redis:
    image: redis:7.0
    container_name: snake-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - snake-network

  # 3. Spring Boot 后端
  backend:
    build: ./snake-aid-backend         # 去这个目录找 Dockerfile
    container_name: snake-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ⚠️ 极其重要：这里是在 Docker 内部网络，主机名必须写 mysql 和 redis，绝不能写 localhost！
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/snake_aid?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    networks:
      - snake-network

networks:
  snake-network:
    driver: bridge
