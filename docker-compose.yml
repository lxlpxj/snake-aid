# ============================================================
# 蛇伤急救系统 —— Docker Compose（本地构建产物 + Docker 运行）
# ============================================================
# 前提（本地已完成）：
#   后端: cd snake-aid-backend && mvn clean package -DskipTests
#   前端: cd snake-admin-web && npm install && npm run build
#
# 一键启动：
#   docker compose up -d --build
#
# 访问：
#   管理后台:   http://localhost
#   后端 API:   http://localhost:8080/api/swagger-ui.html
#   MySQL:     localhost:3306  root / root123456
#   Redis:     localhost:6379
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. MySQL 8.0 —— 数据库
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: snake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: snake
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "127.0.0.1:3307:3306"   # 只绑本机回环，局域网不可直连（容器间走内部网络不受影响）
    volumes:
      - snake-mysql-data:/var/lib/mysql
      # 自动初始化（仅空卷时执行一次，用 backend 下最新版）
      - ./snake-aid-backend/docs/sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - snake-net

  # ----------------------------------------------------------
  # 2. Redis 7 —— 短信验证码 / 缓存
  # ----------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: snake-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"   # 只绑本机回环，局域网不可直连
    volumes:
      - snake-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - snake-net

  # ----------------------------------------------------------
  # 3. Spring Boot 后端 —— 本地已打好 jar，Docker 只负责运行
  # ----------------------------------------------------------
  backend:
    build:
      context: ./snake-aid-backend
      dockerfile: Dockerfile
    image: snakebite-first-aid-backend:latest   # 离线部署: docker load 后按此 tag 认领
    container_name: snake-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MySQL（用服务名 snake-mysql 在自定义网络内互访）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/snake?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 应用自定义
      APP_UPLOAD_DIR: /app/uploads
      APP_AMAP_KEY: ${AMAP_KEY:-your_amap_key_here}
      JWT_SECRET: ${JWT_SECRET:-please-change-to-a-long-random-string}
      JWT_EXPIRE_HOURS: "24"
      JAVA_OPTS: -Xms256m -Xmx512m -Duser.timezone=Asia/Shanghai
      TZ: Asia/Shanghai
    volumes:
      - snake-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - snake-net

  # ----------------------------------------------------------
  # 4. Nginx + 前端 —— 本地已 build 好 dist，Docker 只负责运行
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./snake-admin-web
      dockerfile: Dockerfile
    image: snakebite-first-aid-frontend:latest  # 离线部署: docker load 后按此 tag 认领
    container_name: snake-frontend
    restart: unless-stopped
    ports:
      - "8081:80"          # 如果本地 80 被 IIS/其他占用，改成 "8081:80"
    volumes:
      # 用源码里的 nginx.conf 覆盖镜像内置配置（镜像内是旧版，缺 client_max_body_size 250m）
      - ./snake-admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 镜像内置 HEALTHCHECK 用 localhost（容器内解析成 ::1，而 nginx 只监听 IPv4，会误报 unhealthy）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - backend          # 后端先起
    networks:
      - snake-net

# ============================================================
# 持久化数据卷
# ============================================================
volumes:
  snake-mysql-data:
  snake-redis-data:
  snake-uploads:

# ============================================================
# 自定义 bridge 网络（容器间用服务名互访）
# ============================================================
networks:
  snake-net:
    driver: bridge
