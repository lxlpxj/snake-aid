# ============================================================
# Nginx 配置 —— 前后端同域部署
# /          → 前端静态文件 (dist/build/h5)
# /api/*     → Spring Boot 后端 (localhost:8080)
# /uploads/* → 后端本地文件 (Spring Boot 直接处理)
# ============================================================

server {
    # Railway 会通过 PORT 环境变量覆盖
    # 这里用 envsubst 替换，默认 8080 用于本地测试
    listen ${PORT:-8080};
    server_name _;

    root /var/www/html;
    index index.html;

    # ---- API 反代到 Spring Boot ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Knife4j / Swagger ----
    location ~ /(swagger-ui\.html|doc\.html|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 前端 SPA fallback (hash 路由其实不需要，但保险) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 健康检查 ----
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
